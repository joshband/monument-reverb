name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-macos:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache JUCE FetchContent
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ runner.os }}-juce-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-juce-

      - name: Install ccache
        run: brew install ccache

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ github.ref_name }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Configure
        env:
          CCACHE_DIR: ~/.ccache
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --config Release

      - name: Detect tests
        id: ctest
        run: |
          if [ -f build/CTestTestfile.cmake ]; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        if: steps.ctest.outputs.has_tests == 'true'
        run: ctest --test-dir build --output-on-failure

  local-check-gate:
    # Runs the exact `./scripts/check.sh` command documented in TESTING.md's
    # Quick Start as the local bounded QA gate: curated CTest selection +
    # harness critical suite, built with MONUMENT_ENABLE_TESTS/BUILD_TESTING
    # explicitly ON. This proves the command developers run locally also
    # passes in CI, catching drift between the two. It is intentionally
    # separate from qa_harness.yml's monument_harness_critical/full jobs,
    # which remain the authoritative, wider-scope DSP QA gate (see
    # TESTING.md's DSP QA Authority Policy) and are not modified here.
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN != '' && secrets.SUBMODULE_TOKEN || github.token }}

      - name: Cache JUCE FetchContent
        uses: actions/cache@v4
        with:
          path: build-check/_deps
          key: ${{ runner.os }}-juce-check-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-juce-check-

      - name: Run scripts/check.sh
        run: ./scripts/check.sh
